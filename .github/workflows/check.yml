name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Use the public package cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jessfraz-global-nix
          skipPush: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'runtime/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'runtime/package-lock.json') }}-
      - name: Validate workflows
        run: nix develop .#ci --command actionlint
      - name: Prepare runtime
        run: nix develop .#ci --command make runtime
      - name: Install pinned test browser
        run: nix develop .#ci --command node runtime/node_modules/playwright-core/cli.js install --no-shell chromium
      - name: Prepare verified browser extension fixture
        run: nix develop .#ci --command node runtime/dist/test/fixtures/prepare-browser.js "$RUNNER_TEMP"
      - name: Check Rust and runtime
        run: nix develop .#ci --command make check-prepared
      - name: Check native Codex history
        run: nix develop .#ci --command cargo test --locked --lib history::codex::tests::installed_codex_ -- --ignored
      - name: Check generated bindings
        run: git diff --exit-code
      - name: Evaluate flake
        run: nix flake check --no-build --all-systems
      - name: Build packaged CLI
        id: package
        run: |
          package=$(nix build .#beep-boop --print-out-paths)
          printf 'path=%s\n' "$package" >> "$GITHUB_OUTPUT"
      - name: Check native embeddings
        run: nix develop --command cargo test --locked --lib embeddings::llama::tests::native_runner_is_private_warm_and_returns_retrieval_vectors -- --ignored --exact
      - name: Smoke test package
        run: |
          ./result/bin/beep-boop --version
      - name: Publish qualified package closure
        if: >-
          github.repository == 'jessfraz/beep-boop' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo '::error::CACHIX_AUTH_TOKEN is required to publish the qualified package. Configure a write token scoped to jessfraz-global-nix.'
            exit 1
          fi
          if [[ "${PACKAGE_PATH:-}" != /nix/store/* || ! -d "${PACKAGE_PATH:-}" ]]; then
            echo '::error::The qualified package output is missing.'
            exit 1
          fi
          cachix push jessfraz-global-nix "$PACKAGE_PATH"
