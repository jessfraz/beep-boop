name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Native checks (${{ matrix.phase }})
    runs-on: macos-latest
    # Independent UI groups keep a retry from repeating every interaction
    # on one simulator before its result bundle can finish.
    timeout-minutes: ${{ startsWith(matrix.phase, 'simulator-ui') && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        phase:
          - host
          - simulator-core
          - simulator-performance
          - simulator-ui-controls
          - simulator-ui-history
          - simulator-ui-lifecycle
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Swift and iOS
        run: bash ios/scripts/check.sh "${{ matrix.phase }}"
      - name: Retain failure screenshots and details separately
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-failures-${{ matrix.phase }}-${{ github.run_attempt }}
          path: target/ios-validation/run.*/ios-*-failures/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-validation-${{ matrix.phase }}-${{ github.run_attempt }}
          path: |
            target/ios-validation/run.*/ios-*.xcresult
            target/ios-validation/run.*/ios-*-summary.json
            target/ios-validation/run.*/macos-rendered/
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Native client
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Require every native phase
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
