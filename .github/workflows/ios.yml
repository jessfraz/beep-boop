name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Native checks (${{ matrix.phase }})
    runs-on: macos-latest
    # The existing sequential UI suite takes about 27 minutes before the
    # foreground, suspension and native keyboard coverage added here.
    timeout-minutes: ${{ matrix.phase == 'simulator-ui' && 40 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        phase: [host, simulator-core, simulator-performance, simulator-ui]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Swift and iOS
        run: bash ios/scripts/check.sh "${{ matrix.phase }}"
      - name: Retain failure screenshots and details separately
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-failures-${{ matrix.phase }}-${{ github.run_attempt }}
          path: target/ios-validation/run.*/ios-*-failures/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-validation-${{ matrix.phase }}-${{ github.run_attempt }}
          path: |
            target/ios-validation/run.*/ios-*.xcresult
            target/ios-validation/run.*/ios-*-summary.json
            target/ios-validation/run.*/macos-rendered/
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Native client
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Require every native phase
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
